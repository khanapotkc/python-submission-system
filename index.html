<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบส่งงาน | การเขียนโปรแกรมคอมพิวเตอร์ ม.2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy-950:#050d1a; --navy-900:#081527; --navy-800:#0d2038; --navy-700:#13304f;
  --py-blue:#3776ab; --py-blue-2:#4b8bbe; --py-blue-d:#1f4e79;
  --py-yellow:#ffd43b; --py-yellow-2:#ffe873;
  --ink:#0f2236; --ink-2:#4a5d73; --ink-3:#8a9bb0;
  --panel:#eef3f9; --card:#ffffff; --line:#dbe4ef;
  --done:#22a565; --done-bg:#e3f6ec;
  --sent:#0ea5e9; --sent-bg:#e0f4fd;
  --late:#f0703a; --late-bg:#fdebe2;
  --redo:#8b5cf6; --redo-bg:#efe9fe;
  --todo:#f5a524; --todo-bg:#fff4dc;
  --exam:#3776ab; --exam-bg:#e4eef8;
  --danger:#e5484d;
  --radius:18px;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --sans:'Prompt',system-ui,sans-serif;
  --shadow:0 10px 30px -12px rgba(8,21,39,.28),0 2px 6px rgba(8,21,39,.06);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--navy-950);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.mono{font-family:var(--mono)}
.hidden{display:none!important}

/* ---------- background ---------- */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;
  background:radial-gradient(1200px 600px at 85% -10%,rgba(55,118,171,.35),transparent 60%),
             radial-gradient(900px 500px at -10% 110%,rgba(255,212,59,.12),transparent 60%),
             linear-gradient(180deg,var(--navy-900),var(--navy-950));}
.bg::before{content:"";position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:42px 42px;mask-image:linear-gradient(180deg,#000 0%,transparent 75%)}
.float{position:absolute;font-family:var(--mono);color:rgba(140,180,220,.13);font-size:15px;white-space:nowrap;animation:drift linear infinite;user-select:none}
@keyframes drift{from{transform:translateY(110vh)}to{transform:translateY(-20vh)}}
@media (prefers-reduced-motion:reduce){.float{animation:none;display:none}}

/* ---------- header ---------- */
.top{max-width:1280px;margin:0 auto;padding:22px 24px 18px;display:flex;align-items:center;gap:22px}
.logo{width:84px;height:84px;flex:none;display:grid;place-items:center;border-radius:22px;
  background:linear-gradient(145deg,var(--py-blue),var(--py-blue-d));box-shadow:0 0 0 3px rgba(255,212,59,.5),0 12px 30px -8px rgba(55,118,171,.7);overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain;background:#fff}
.logo svg{width:56px;height:56px}
.titles h1{margin:0;font-size:clamp(22px,3vw,32px);font-weight:700;color:var(--py-yellow);letter-spacing:.2px;line-height:1.2}
.titles h1 .acc{color:#fff}
.titles .sub{color:#fff;font-weight:600;font-size:clamp(14px,1.6vw,17px);margin-top:4px}
.titles .meta{color:#b8c9dc;font-size:clamp(12px,1.3vw,14.5px);margin-top:2px}
.term{margin-left:auto;width:min(380px,32vw);background:rgba(5,13,26,.75);border:1px solid rgba(255,212,59,.35);border-radius:14px;
  padding:10px 14px 12px;font-family:var(--mono);font-size:12.5px;color:#9fc3e7;box-shadow:inset 0 0 0 1px rgba(255,255,255,.03)}
.term .dots{display:flex;gap:6px;margin-bottom:8px}
.term .dots i{width:9px;height:9px;border-radius:50%;background:#ff5f57}.term .dots i:nth-child(2){background:#febc2e}.term .dots i:nth-child(3){background:#28c840}
.term .ln{min-height:18px;white-space:pre;overflow:hidden;text-overflow:ellipsis}
.term .p{color:var(--py-yellow)} .term .k{color:#ff79c6} .term .s{color:#a5e075} .term .f{color:#7fd3ff}
.caret{display:inline-block;width:7px;height:14px;background:var(--py-yellow);vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.rule{height:2px;background:linear-gradient(90deg,transparent,var(--py-yellow),transparent);opacity:.55;max-width:1280px;margin:0 auto}

/* ---------- main window ---------- */
main{max-width:1280px;margin:26px auto 40px;padding:0 24px}
.win{background:var(--panel);border-radius:26px;box-shadow:0 30px 80px -30px rgba(0,0,0,.6);overflow:hidden;animation:rise .45s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.winbar{display:flex;align-items:center;gap:14px;padding:14px 22px;background:#e2eaf3;border-bottom:1px solid var(--line)}
.winbar .dots{display:flex;gap:7px}.winbar .dots i{width:12px;height:12px;border-radius:50%;background:#ff5f57}
.winbar .dots i:nth-child(2){background:#febc2e}.winbar .dots i:nth-child(3){background:#28c840}
.winbar .path{font-family:var(--mono);font-size:13px;color:var(--ink-2)}
.winbar .path b{color:var(--py-blue)}
.winbar .acts{margin-left:auto;display:flex;gap:10px}
.winbody{padding:26px 28px 32px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--py-blue-d);background:#fff;color:var(--py-blue-d);
  padding:9px 18px;border-radius:12px;font-weight:600;cursor:pointer;transition:.18s;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--py-blue-d);color:#fff;transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn svg{width:18px;height:18px}
.btn.sm{padding:6px 12px;font-size:13.5px;border-radius:10px;border-width:1.5px}
.btn.pri{background:linear-gradient(135deg,var(--py-blue),var(--py-blue-d));color:#fff;border-color:transparent}
.btn.pri:hover{filter:brightness(1.1)}
.btn.yel{background:var(--py-yellow);border-color:var(--py-yellow);color:var(--navy-900)}
.btn.yel:hover{background:var(--py-yellow-2)}
.btn.ghost{border-color:var(--line);color:var(--ink-2)}
.btn.ghost:hover{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn.danger:hover{background:var(--danger);color:#fff}

.sec-title{display:flex;align-items:center;gap:12px;margin:0 0 18px}
.sec-title h2{margin:0;font-size:22px;font-weight:700;position:relative;padding-bottom:8px}
.sec-title h2::after{content:"";position:absolute;left:0;bottom:0;width:100%;height:3px;border-radius:3px;background:var(--py-yellow)}
.sec-title .ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--py-blue);color:#fff}
.sec-title .ico svg{width:20px;height:20px}
.sec-title .side{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}

/* ---------- login ---------- */
.login-wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:34px;align-items:center;padding:20px 0}
.hero h2{font-size:clamp(28px,4vw,46px);line-height:1.15;margin:0 0 14px;color:#fff;font-weight:700}
.hero h2 span{background:linear-gradient(90deg,var(--py-yellow),#ffb703);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:#b8c9dc;font-size:16px;line-height:1.7;margin:0 0 22px;max-width:520px}
.hero .code{font-family:var(--mono);background:rgba(5,13,26,.6);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:16px 18px;color:#cfe0f2;font-size:14px;line-height:1.75;max-width:520px}
.code .c{color:#6f8aa6}.code .k{color:#ff79c6}.code .f{color:#7fd3ff}.code .s{color:#a5e075}.code .n{color:#ffb86c}.code .y{color:var(--py-yellow)}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#d9e6f3;font-size:13.5px}
.chip i{width:9px;height:9px;border-radius:50%}

.editor{background:#0b1b2e;border-radius:22px;border:1px solid rgba(255,212,59,.28);box-shadow:0 40px 80px -30px rgba(0,0,0,.8);overflow:hidden;animation:rise .5s ease both}
.editor .bar{display:flex;align-items:center;gap:8px;padding:12px 16px;background:#081526;border-bottom:1px solid rgba(255,255,255,.06)}
.editor .bar i{width:11px;height:11px;border-radius:50%;background:#ff5f57}.editor .bar i:nth-child(2){background:#febc2e}.editor .bar i:nth-child(3){background:#28c840}
.tabs{display:flex;margin-left:14px;gap:4px}
.tabs button{background:none;border:0;padding:7px 14px;border-radius:9px 9px 0 0;color:#7f97b2;font-family:var(--mono);font-size:13px;cursor:pointer;display:flex;align-items:center;gap:7px}
.tabs button.on{background:#0b1b2e;color:var(--py-yellow);box-shadow:inset 0 2px 0 var(--py-yellow)}
.editor form{padding:18px 22px 24px;font-family:var(--mono);color:#cfe0f2}
.eline{display:grid;grid-template-columns:26px 1fr;align-items:center;gap:12px;min-height:34px;font-size:14px}
.eline .no{color:#3d5673;text-align:right;font-size:12.5px}
.field{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.field .var{color:#7fd3ff}.field .eq{color:#ff79c6}
.inp{position:relative;flex:1;min-width:180px}
.inp input{width:100%;background:#06111f;border:1.5px solid #1d3654;border-radius:10px;padding:11px 40px 11px 14px;color:#a5e075;font-family:var(--sans);font-size:15.5px;outline:none;transition:.2s}
.inp input:focus{border-color:var(--py-yellow);box-shadow:0 0 0 4px rgba(255,212,59,.13)}
.inp input::placeholder{color:#43607f}
.inp .eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:#58779a;cursor:pointer;padding:4px;display:grid}
.inp .eye svg{width:18px;height:18px}
.run{margin-top:14px;width:100%;padding:14px;border:0;border-radius:12px;cursor:pointer;font-family:var(--mono);font-weight:700;font-size:15px;
  background:linear-gradient(135deg,var(--py-yellow),#ffb703);color:var(--navy-900);display:flex;align-items:center;justify-content:center;gap:10px;transition:.2s}
.run:hover{transform:translateY(-1px);box-shadow:0 10px 24px -8px rgba(255,212,59,.6)}
.run svg{width:18px;height:18px}
.hint{margin-top:14px;font-size:12.5px;color:#6f8aa6;line-height:1.7}
.err{margin-top:12px;padding:10px 12px;border-radius:10px;background:rgba(229,72,77,.12);border:1px solid rgba(229,72,77,.4);color:#ff9a9d;font-family:var(--sans);font-size:14px}
.announce-dark{margin-top:22px;max-width:520px;padding:14px 16px;border-radius:14px;background:rgba(255,212,59,.08);border:1px dashed rgba(255,212,59,.45);color:#ffe9a3;font-size:14.5px;line-height:1.6;white-space:pre-wrap}

/* ---------- student ---------- */
.hello{font-family:var(--mono);font-size:15px;color:var(--ink-2);margin:-4px 0 18px}
.hello .f{color:#0a7bb8}.hello .s{color:#2f8f3a}
.profile{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:18px}
.pcard{background:#fff;border-radius:16px;padding:14px 18px;border-left:5px solid var(--py-blue);box-shadow:var(--shadow)}
.pcard small{display:block;color:var(--ink-2);font-weight:500;font-size:13px}
.pcard b{display:block;font-size:20px;margin-top:2px;word-break:break-word}
.stats{display:grid;grid-template-columns:1.1fr 1.2fr 1.7fr;gap:16px;margin-bottom:22px}
.stat{background:#fff;border-radius:18px;padding:18px 20px;box-shadow:var(--shadow);display:flex;align-items:center;gap:18px}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:21px}
.ring circle{fill:none;stroke-width:10}
.ring .tr{stroke:#e6edf5}.ring .pg{stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.stat h4{margin:0;font-size:14px;color:var(--ink-2);font-weight:500}
.stat .big{font-size:28px;font-weight:700;line-height:1.2}
.stat .big small{font-size:15px;color:var(--ink-3);font-weight:500}
.bar{height:10px;border-radius:99px;background:#e6edf5;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--py-blue),var(--py-blue-2));transition:width 1s cubic-bezier(.2,.8,.2,1)}
.counts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:100%}
.cnt{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;font-size:14px;font-weight:500}
.cnt b{margin-left:auto;font-size:18px}
.cnt svg{width:18px;height:18px}
.k-done{background:var(--done-bg);color:#137a47}.k-sent{background:var(--sent-bg);color:#0369a1}
.k-late{background:var(--late-bg);color:#b8461a}.k-redo{background:var(--redo-bg);color:#6431d6}
.k-todo{background:var(--todo-bg);color:#9a5b00}.k-exam{background:var(--exam-bg);color:var(--py-blue-d)}
.announce{display:flex;gap:12px;align-items:flex-start;padding:14px 18px;border-radius:14px;background:#fffbea;border:1.5px dashed #f2c94c;margin-bottom:20px;color:#6b5200;white-space:pre-wrap;line-height:1.6}
.announce svg{width:22px;height:22px;flex:none;color:#d49b00;margin-top:2px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.filters button{border:1.5px solid var(--line);background:#fff;padding:8px 16px;border-radius:999px;cursor:pointer;font-weight:500;color:var(--ink-2);transition:.15s}
.filters button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.filters button span{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:rgba(0,0,0,.07);margin-left:6px;font-size:12.5px}
.filters button.on span{background:rgba(255,255,255,.2)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.task{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;animation:rise .45s ease both;transition:transform .2s,box-shadow .2s}
.task:hover{transform:translateY(-4px);box-shadow:0 22px 40px -18px rgba(8,21,39,.35)}
.task .hd{display:flex;align-items:center;gap:10px;padding:14px 18px;color:#fff;font-weight:600;font-size:16.5px}
.task .hd .tag{font-family:var(--mono);font-size:13px;font-weight:700;background:rgba(255,255,255,.22);padding:3px 9px;border-radius:8px;flex:none}
.task .hd .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task .hd svg{width:20px;height:20px;margin-left:auto;flex:none;opacity:.9}
.task.done .hd{background:linear-gradient(120deg,#22a565,#4cc485)}
.task.sent .hd{background:linear-gradient(120deg,#0284c7,#38bdf8)}
.task.late .hd{background:linear-gradient(120deg,#e35d24,#f7925b)}
.task.redo .hd{background:linear-gradient(120deg,#7444e8,#a585fa)}
.task.todo .hd{background:linear-gradient(120deg,#f59e0b,#ffbe4d)}
.task.exam .hd{background:linear-gradient(120deg,var(--py-blue-d),var(--py-blue-2))}
.task .bd{padding:20px 22px 20px;display:flex;flex-direction:column;flex:1}
.task .row{display:flex;align-items:center;gap:16px}
.st-ico{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;flex:none}
.st-ico svg{width:30px;height:30px}
.done .st-ico{background:var(--done);color:#fff}.sent .st-ico{background:var(--sent);color:#fff}
.late .st-ico{background:var(--late);color:#fff}.redo .st-ico{background:var(--redo);color:#fff}
.todo .st-ico{background:var(--todo-bg);color:var(--todo)}.exam .st-ico{background:var(--exam-bg);color:var(--exam)}
.task .stx b{display:block;font-size:21px}
.task .stx small{color:var(--ink-3);font-size:13.5px}
.score{margin-top:16px;padding-top:14px;border-top:3px solid var(--py-yellow)}
.score .l{display:flex;align-items:baseline;justify-content:space-between;font-size:14px;color:var(--ink-2)}
.score .l b{font-size:22px;color:var(--ink)} .score .l b small{font-size:14px;color:var(--ink-3);font-weight:500}
.score .bar>i{background:linear-gradient(90deg,var(--py-yellow),#f5b300)}
.score .na{font-size:13.5px;color:var(--ink-3);font-style:italic}
.task .ft{margin-top:auto;padding-top:16px;display:flex;justify-content:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;font-size:13.5px;font-weight:500}
.pill svg{width:15px;height:15px}
.empty{grid-column:1/-1;text-align:center;padding:40px;color:var(--ink-3);font-family:var(--mono)}
.foot-note{margin-top:22px;font-size:12.5px;color:var(--ink-3);text-align:right;font-family:var(--mono)}

/* ---------- admin ---------- */
.atabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;background:#fff;padding:6px;border-radius:14px;box-shadow:var(--shadow)}
.atabs button{border:0;background:none;padding:10px 16px;border-radius:10px;cursor:pointer;font-weight:500;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.atabs button svg{width:18px;height:18px}
.atabs button.on{background:var(--py-blue-d);color:#fff}
.atabs button:not(.on):hover{background:var(--panel)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar .grow{flex:1}
.sel,.txt{border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:9px 12px;outline:none;min-width:0}
.sel:focus,.txt:focus{border-color:var(--py-blue)}
.search{position:relative;min-width:220px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--ink-3)}
.search input{padding-left:36px;width:100%}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.kpi{background:#fff;border-radius:16px;padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi small{color:var(--ink-2);font-size:13.5px}
.kpi b{display:block;font-size:30px;line-height:1.25}
.kpi .ic{position:absolute;right:14px;top:14px;width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.kpi .ic svg{width:21px;height:21px}
.panel{background:#fff;border-radius:18px;padding:18px 20px;box-shadow:var(--shadow);margin-bottom:18px}
.panel h3{margin:0 0 14px;font-size:17px;display:flex;align-items:center;gap:10px}
.panel h3 .mono{font-size:12px;color:var(--ink-3);font-weight:400}
.two{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}
.srow{display:grid;grid-template-columns:150px 1fr 54px;gap:12px;align-items:center;margin:9px 0;font-size:14px}
.srow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .nm b{font-family:var(--mono);color:var(--py-blue-d)}
.stack{display:flex;height:16px;border-radius:99px;overflow:hidden;background:#eef2f7}
.stack i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin-bottom:6px}
.legend span{display:flex;align-items:center;gap:6px}.legend i{width:11px;height:11px;border-radius:3px}
.cls-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.clsc{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px}
.clsc b{font-size:18px}.clsc small{color:var(--ink-3)}
.follow{max-height:420px;overflow:auto}
.fl{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px dashed var(--line);font-size:14px}
.fl .n{flex:1;min-width:0}.fl .n small{display:block;color:var(--ink-3);font-size:12.5px}
.fl .miss{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:55%}
.mtag{font-family:var(--mono);font-size:11.5px;padding:2px 7px;border-radius:6px;background:var(--todo-bg);color:#9a5b00}
.mtag.r{background:var(--redo-bg);color:#6431d6}
.badge{display:inline-grid;place-items:center;min-width:28px;height:28px;padding:0 8px;border-radius:9px;font-weight:700;font-size:14px;background:#fde8e8;color:#c0262c}

.gt th small{display:block;color:var(--ink-3);font-weight:400;font-size:11.5px;max-width:110px;overflow:hidden;text-overflow:ellipsis}
.gt .stk{position:sticky;background:#fff;z-index:1;text-align:left}

.gt .c0{left:0;min-width:56px;text-align:center}.gt .c1{left:56px;min-width:230px;box-shadow:6px 0 8px -6px rgba(0,0,0,.12)}
.gt tbody tr:hover td{background:#f8fbff}

.ss{appearance:none;-webkit-appearance:none;border:0;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600;cursor:pointer;min-width:94px;text-align:center;text-align-last:center}
.ss.done{background:var(--done-bg);color:#137a47}.ss.sent{background:var(--sent-bg);color:#0369a1}.ss.late{background:var(--late-bg);color:#b8461a}
.ss.redo{background:var(--redo-bg);color:#6431d6}.ss.todo{background:#f3f5f8;color:#98a6b6}

.si{width:62px;border:1.5px solid var(--line);border-radius:8px;padding:6px 4px;text-align:center;outline:none;font-family:var(--mono)}

const ic = (n, extra='') => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" ${extra}>${IC[n]||''}</svg>`;
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = s => document.querySelector(s);

const LOGO_SVG = `<svg viewBox="0 0 64 64" fill="none"><path d="M22 20 10 32l12 12" stroke="#ffd43b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M42 20l12 12-12 12" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M36 14 28 50" stroke="#ffd43b" stroke-width="5" stroke-linecap="round" opacity=".9"/></svg>`;

/* =====================================================================
 *  Status helpers
 * =================================================================== */
const KIND = {
  done:{label:'ตรวจแล้ว', desc:'ครูตรวจเรียบร้อยแล้ว', icon:'check', color:'var(--done)'},
  sent:{label:'ส่งแล้ว', desc:'ส่งแล้ว รอครูตรวจ', icon:'inbox', color:'var(--sent)'},
  late:{label:'ส่งช้า', desc:'ส่งหลังกำหนด', icon:'clock', color:'var(--late)'},
  redo:{label:'ส่งใหม่', desc:'แก้ไขงานแล้วส่งใหม่อีกครั้ง', icon:'refresh', color:'var(--redo)'},
  todo:{label:'ยังไม่ส่ง', desc:'ยังไม่พบการส่งงาน', icon:'hourglass', color:'var(--todo)'},
  exam:{label:'การสอบ', desc:'คะแนนสอบ', icon:'star', color:'var(--exam)'}
};
function kindOf(v){
  v = String(v||'').trim();
  if(!v) return 'todo';
  if(v.includes('ตรวจแล้ว')) return 'done';
  if(v.includes('ช้า')) return 'late';
  if(v.includes('ใหม่') || v.includes('แก้')) return 'redo';
  if(v.includes('ยังไม่')) return 'todo';
  return 'sent';
}
const isSubmitted = k => k==='done' || k==='sent' || k==='late';
function splitTitle(t){
  const i = String(t).indexOf(':');
  return i>0 ? {tag:t.slice(0,i).trim(), name:t.slice(i+1).trim()} : {tag:'', name:String(t).trim()};
}
const num = v => { const n = parseFloat(v); return isNaN(n) ? null : n; };
const fmt = n => n==null ? '–' : (Math.round(n*100)/100).toLocaleString('th-TH');

/* =====================================================================
 *  API (Apps Script or demo mock)
 * =================================================================== */
/* โหมดการทำงาน
 *  - GAS  : ติดตั้งบน Google Apps Script → อ่าน/เขียนชีตได้ครบ (Code.gs)
 *  - LIVE : เปิดไฟล์นี้ตรง ๆ / โฮสต์ที่อื่น → อ่านข้อมูลจริงจาก Google Sheets ที่แชร์แบบ "ทุกคนที่มีลิงก์" (อ่านอย่างเดียว)
 *  - DEMO : เติม ?demo=1 ท้าย URL → ข้อมูลจำลอง */
/* URL ของ Apps Script Web App (ลงท้าย /exec) — ใส่แล้วหน้าเว็บนี้ (เช่นบน GitHub Pages) จะแก้ไขข้อมูลในชีตได้ทันที
 * หรือครูวาง URL ได้ที่ Admin › ตั้งค่า (จำไว้ในเบราว์เซอร์เครื่องนั้น) */
const API_URL = '';
const apiUrl = () => { try { return localStorage.getItem('pyss_api') || API_URL; } catch(e){ return API_URL; } };
const IS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
const MODE = IS_GAS ? 'gas' : (/[?&]demo=1/.test(location.search) ? 'demo' : (apiUrl() ? 'api' : 'live'));
async function callApi(url, fn, args){
  let r;
  try { r = await fetch(url, { method:'POST', redirect:'follow', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({fn, args}) }); }
  catch(e){ throw new Error('เชื่อมต่อ Apps Script ไม่ได้ — ตรวจสอบ URL และการ Deploy (ผู้มีสิทธิ์เข้าถึง: ทุกคน)'); }
  const text = await r.text();
  let j; try { j = JSON.parse(text); } catch(e){ throw new Error('Apps Script ตอบกลับไม่ถูกต้อง — ตรวจสอบว่าวางโค้ด Code.gs เวอร์ชันล่าสุดและ Deploy เวอร์ชันใหม่แล้ว'); }
  if (!j.ok) throw new Error(j.error);
  return j.data;
}
function api(fn, ...args){
  if (MODE === 'api') return callApi(apiUrl(), fn, args);
  return new Promise((resolve, reject) => {
    if (IS_GAS) {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(e => reject(new Error(String(e && e.message || e).replace(/^(Error|Exception):\s*/,''))))[fn](...args);
    } else {
      const B = MODE === 'demo' ? MOCK : LIVE;
      setTimeout(() => {
        try { Promise.resolve(B[fn](...args)).then(v => resolve(JSON.parse(JSON.stringify(v))), reject); }
        catch(e){ reject(e); }
      }, MODE === 'demo' ? 350 : 0);
    }
  });
}

const store = {
  get(){ try { return JSON.parse(sessionStorage.getItem('pyss')||'null'); } catch(e){ return null; } },
  set(v){ try { v ? sessionStorage.setItem('pyss', JSON.stringify(v)) : sessionStorage.removeItem('pyss'); } catch(e){} }
};

const S = { token:null, role:null, app:null, announce:'', student:null, filter:'all',
            admin:null, tab:'overview', cls:'all', q:'', dirty:new Map(), showPw:false };

/* =====================================================================
 *  UI utilities
 * =================================================================== */
let loadingCount = 0;
function loading(on, text='กำลังประมวลผล...'){
  loadingCount += on ? 1 : -1;
  const ov = $('#overlay');
  const existing = ov.querySelector('.loading');
  if (loadingCount > 0 && !existing) ov.insertAdjacentHTML('beforeend', `<div class="loading"><div class="box"><div class="spin"></div><span>&gt;&gt;&gt; ${esc(text)}<span class="caret"></span></span></div></div>`);
  if (loadingCount <= 0) { loadingCount = 0; existing && existing.remove(); }
}
async function run(promiseFn, text){
  loading(true, text);
  try { return await promiseFn(); }
  catch(e){
    if (String(e.message).includes('SESSION_EXPIRED')) { toast('หมดเวลาเข้าสู่ระบบ กรุณาเข้าสู่ระบบใหม่', true); doLogout(true); return null; }
    throw e;
  }
  finally { loading(false); }
}
function toast(msg, isErr){
  const el = document.createElement('div');
  el.className = 'toast' + (isErr ? ' err' : '');
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), 3800);
}
function modal({title, icon='edit', body, okText='บันทึก', okClass='pri', onOk, cancelText='ยกเลิก'}){
  const ov = $('#overlay');
  const wrap = document.createElement('div');
  wrap.className = 'modal';
  wrap.innerHTML = `<div class="box" role="dialog" aria-modal="true">
    <div class="mh">${ic(icon,'width="20" height="20"')}<span>${esc(title)}</span><button data-x aria-label="ปิด">${ic('x','width="22" height="22"')}</button></div>
    <div class="mb">${body}</div>
    <div class="mf"><button class="btn ghost" data-x>${esc(cancelText)}</button>${onOk?`<button class="btn ${okClass}" data-ok>${esc(okText)}</button>`:''}</div></div>`;
  const close = () => wrap.remove();
  wrap.addEventListener('click', e => { if (e.target === wrap || e.target.closest('[data-x]')) close(); });
  if (onOk) wrap.querySelector('[data-ok]').onclick = async () => {
    try { const r = await onOk(wrap); if (r !== false) close(); } catch(e){ toast(e.message, true); }
  };
  ov.appendChild(wrap);
  const f = wrap.querySelector('input,select,textarea'); f && f.focus();
  return wrap;
}
function confirmBox(title, html, okText='ยืนยัน', danger=true){
  return new Promise(res => {
    const w = modal({title, icon: danger?'alert':'checkc', body:`<div style="line-height:1.7">${html}</div>`, okText, okClass: danger?'danger':'pri', onOk: () => { res(true); }});
    w.addEventListener('click', e => { if (e.target === w || e.target.closest('[data-x]')) res(false); });
  });
}
function winShell(path, actions, body){
  return `<section class="win"><div class="winbar"><div class="dots"><i></i><i></i><i></i></div>
    <div class="path">~/python/<b>${esc(path)}</b></div><div class="acts">${actions}</div></div>
    <div class="winbody">${body}</div></section>`;
}

function decorate(){
  const snippets = ['def submit(task):','for week in range(1, 11):','if score >= 80:','print("Hello, World!")','while not done:','import random','name = input()','return True','elif x > 0:','# keep coding 🐍','len(tasks)','try:','except ValueError:','x = [i**2 for i in range(5)]'];
  const bg = $('#bg');
  for (let i=0;i<14;i++){
    const s = document.createElement('div');
    s.className = 'float';
    s.textContent = snippets[i % snippets.length];
    s.style.left = (Math.random()*95) + '%';
    s.style.animationDuration = (28 + Math.random()*30) + 's';
    s.style.animationDelay = (-Math.random()*50) + 's';
    s.style.fontSize = (12 + Math.random()*6) + 'px';
    bg.appendChild(s);
  }
  // typing terminal
  const scripts = [
    ['<span class="p">&gt;&gt;&gt;</span> <span class="k">import</span> python', '<span class="p">&gt;&gt;&gt;</span> <span class="k">for</span> task <span class="k">in</span> progress:', '<span class="p">...</span>     <span class="f">submit</span>(task) <span class="s"># ✔</span>'],
    ['<span class="p">&gt;&gt;&gt;</span> score = <span class="f">sum</span>(my_scores)', '<span class="p">&gt;&gt;&gt;</span> <span class="f">print</span>(<span class="s">"Keep going! 🐍"</span>)', 'Keep going! 🐍'],
    ['<span class="p">&gt;&gt;&gt;</span> <span class="k">while</span> <span class="k">not</span> done:', '<span class="p">...</span>     learn(); code(); debug()', '<span class="p">&gt;&gt;&gt;</span> <span class="s">"Success"</span>']
  ];
  const lines = [$('#t1'),$('#t2'),$('#t3')];
  let si = 0;
  const strip = h => h.replace(/<[^>]+>/g,'').replace(/&gt;/g,'>').replace(/&lt;/g,'<').replace(/&amp;/g,'&');
  async function play(){
    const sc = scripts[si++ % scripts.length];
    lines.forEach(l => l.innerHTML = '');
    for (let i=0;i<sc.length;i++){
      const plain = strip(sc[i]);
      for (let c=1;c<=plain.length;c++){ lines[i].innerHTML = esc(plain.slice(0,c)) + '<span class="caret"></span>'; await new Promise(r=>setTimeout(r, 38)); }
      lines[i].innerHTML = sc[i];
      await new Promise(r=>setTimeout(r, 300));
    }
    lines[sc.length-1].insertAdjacentHTML('beforeend','<span class="caret"></span>');
    setTimeout(play, 3200);
  }
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) play();
  else lines.forEach((l,i)=> l.innerHTML = scripts[0][i]);
}

function studentSummary(items){
  const st = items.filter(x => x.hasStatus);
  const c = {done:0,sent:0,late:0,redo:0,todo:0};
  st.forEach(x => c[kindOf(x.status)]++);
  const submitted = c.done + c.sent + c.late;
  const sc = items.filter(x => x.hasScore);
  let got = 0, totalMax = 0, gradedMax = 0;
  sc.forEach(x => { const n = num(x.score); if (x.max) totalMax += x.max; if (n != null){ got += n; if (x.max) gradedMax += x.max; } });
  return {c, total: st.length, submitted, got, totalMax, gradedMax};
}
function ring(pct, color){
  const r = 40, C = 2*Math.PI*r;
  return `<div class="ring"><svg viewBox="0 0 100 100"><circle class="tr" cx="50" cy="50" r="${r}"/><circle class="pg" cx="50" cy="50" r="${r}" stroke="${color}" stroke-dasharray="${C}" stroke-dashoffset="${C}" data-off="${C*(1-pct/100)}"/></svg><div class="v">${Math.round(pct)}%</div></div>`;
}
function taskCard(x, i){
  const t = splitTitle(x.title);
  const k = x.hasStatus ? kindOf(x.status) : 'exam';
  const K = KIND[k];
  const label = x.hasStatus ? (x.status || 'ยังไม่ส่ง') : 'คะแนนสอบ';
  const n = num(x.score);
  let scoreHtml = '';
  if (x.hasScore) {
    if (n != null) {
      const pct = x.max ? Math.min(100, n/x.max*100) : 100;
      scoreHtml = `<div class="score"><div class="l"><span>คะแนนที่ได้</span><b>${fmt(n)}${x.max?` <small>/ ${fmt(x.max)}</small>`:''}</b></div>${x.max?`<div class="bar"><i style="width:0" data-w="${pct}%"></i></div>`:''}</div>`;
    } else {
      scoreHtml = `<div class="score"><div class="l"><span>คะแนนที่ได้</span><b>– ${x.max?`<small>/ ${fmt(x.max)}</small>`:''}</b></div><div class="na">ยังไม่มีการบันทึกคะแนน</div></div>`;

  }

    : `<span class="pill k-${k}">${ic(K.icon)} ${esc(x.hasStatus ? label : (n!=null?'มีคะแนนแล้ว':'รอคะแนน'))}</span>`;
  return `<article class="task ${k}" style="animation-delay:${Math.min(i*45,600)}ms">
    <div class="hd">${t.tag?`<span class="tag">${esc(t.tag)}</span>`:''}<span class="tt" title="${esc(x.title)}">${esc(t.name)}</span>${ic(K.icon)}</div>

}

const TABS = [
  ['overview','ภาพรวม','chart'], ['status','สถานะการส่ง','checkc'], ['score','คะแนน','star'],
  ['students','นักเรียน','users'], ['items','ภาระงาน','book'], ['settings','ตั้งค่า','gear']
];
function filteredStudents(){
  const q = S.q.trim().toLowerCase();
  return S.admin.students.filter(s => (S.cls==='all' || s.cls===S.cls) &&
    (!q || [s.name, s.stdId, s.username, s.number].some(v => String(v||'').toLowerCase().includes(q))))
    .sort((a,b) => a.cls.localeCompare(b.cls) || (num(a.number)||0) - (num(b.number)||0));
}
const sid = s => s.stdId || s.name;
const dkey = (type, s, key) => `${type}|${sid(s)}|${key}`;
function curVal(type, s, key){
  const d = S.dirty.get(dkey(type, s, key));
  return d ? d.value : (type==='status' ? s.status[key] : s.score[key]) || '';
}
function setVal(type, s, key, value){
  const k = dkey(type, s, key);
  const orig = (type==='status' ? s.status[key] : s.score[key]) || '';
  if (String(value) === String(orig)) S.dirty.delete(k);
  else S.dirty.set(k, {type, stdId:s.stdId, name:s.name, key, value});
}

  const A = S.admin;

  const filters = showFilters ? `<div class="toolbar">

เชื่อมต่อ Apps Script หนึ่งครั้ง เพื่อแก้สถานะ คะแนน นักเรียน และภาระงานจากหน้านี้ได้เลย</div><button class="btn sm pri" id="bGoApi" style="white-space:nowrap">${ic('link')} เปิดโหมดแก้ไข</button></div>` : ''}

function saveBar(){

/* ---- Overview ---- */
function tabOverview(){
  const A = S.admin, list = filteredStudents();
  const sItems = A.items.filter(x => x.inStatus);
  let cells = 0, sub = 0;
  const per = sItems.map(x => {
    const c = {done:0,sent:0,late:0,redo:0,todo:0};
    list.filter(s=>s.inStatus).forEach(s => c[kindOf(s.status[x.key])]++);
    const tot = Object.values(c).reduce((a,b)=>a+b,0);
    cells += tot; sub += c.done + c.sent + c.late;
    return {x, c, tot};
  });
  const follow = list.map(s => {
    const miss = sItems.filter(x => { const k = kindOf(s.status[x.key]); return k==='todo' || k==='redo'; });
    return {s, miss};
  }).filter(f => f.miss.length).sort((a,b) => b.miss.length - a.miss.length);
  // ignore weeks no one has submitted yet (likely future weeks) for the follow-up list
  const active = per.filter(p => p.c.done + p.c.sent + p.c.late + p.c.redo > 0).map(p => p.x.key);
  const followActive = list.map(s => ({s, miss: sItems.filter(x => active.includes(x.key) && ['todo','redo'].includes(kindOf(s.status[x.key])))}))
    .filter(f => f.miss.length).sort((a,b)=> b.miss.length - a.miss.length);
  const classes = (S.cls==='all' ? A.classes : [S.cls]).map(c => {
    const ss = A.students.filter(s => s.cls===c);
    let t=0, d=0, got=0, mx=0;
    ss.forEach(s => {
      sItems.filter(x=>active.includes(x.key)).forEach(x => { t++; if (isSubmitted(kindOf(s.status[x.key]))) d++; });
      A.items.filter(x=>x.inScore && x.max).forEach(x => { const n = num(s.score[x.key]); if (n!=null){ got+=n; mx+=x.max; } });
    });
    return {c, n:ss.length, pct: t? d/t*100 : 0, avg: mx? got/mx*100 : null};
  });
  const seg = (c,tot) => ['done','sent','late','redo','todo'].map(k => c[k] ? `<i style="width:${c[k]/tot*100}%;background:${KIND[k].color}" title="${KIND[k].label} ${c[k]}"></i>` : '').join('');
  return `
  <div class="kpis">
    <div class="kpi"><small>นักเรียน</small><b>${list.length}</b><div class="ic k-exam">${ic('users')}</div></div>
    <div class="kpi"><small>ภาระงาน (มีการส่งแล้ว)</small><b>${sItems.length} <small style="font-size:15px;color:var(--ink-3)">(${active.length})</small></b><div class="ic k-sent">${ic('book')}</div></div>
    <div class="kpi"><small>อัตราการส่ง (งานที่เปิดแล้ว)</small><b>${(() => { let t=0,d=0; list.forEach(s=>sItems.filter(x=>active.includes(x.key)).forEach(x=>{t++; if(isSubmitted(kindOf(s.status[x.key]))) d++;})); return t? Math.round(d/t*100):0; })()}%</b><div class="ic k-done">${ic('checkc')}</div></div>
    <div class="kpi"><small>ต้องติดตาม (ค้าง ≥ 1 งาน)</small><b>${followActive.length}</b><div class="ic k-todo">${ic('alert')}</div></div>
  </div>
  <div class="two">
    <div class="panel"><h3>${ic('chart','width="20" height="20"')} สถานะรายภาระงาน <span class="mono">${S.cls==='all'?'ทุกห้อง':'ห้อง '+esc(S.cls)}</span></h3>
      <div class="legend">${['done','sent','late','redo','todo'].map(k=>`<span><i style="background:${KIND[k].color}"></i>${KIND[k].label}</span>`).join('')}</div>
      ${per.map(p => { const t = splitTitle(p.x.title); const s = p.c.done+p.c.sent+p.c.late; return `<div class="srow"><div class="nm" title="${esc(p.x.title)}"><b>${esc(t.tag||'')}</b> ${esc(t.name)}</div><div class="stack">${p.tot?seg(p.c,p.tot):''}</div><div class="mono" style="font-size:13px;text-align:right">${s}/${p.tot}</div></div>`; }).join('')}
    </div>
    <div>
      <div class="panel"><h3>${ic('users','width="20" height="20"')} รายห้อง</h3><div class="cls-cards">
        ${classes.map(c => `<div class="clsc"><div style="display:flex;justify-content:space-between;align-items:baseline"><b>ห้อง ${esc(c.c)}</b><small>${c.n} คน</small></div>
          <div style="font-size:13px;color:var(--ink-2);margin-top:6px">ส่งงาน ${Math.round(c.pct)}%</div><div class="bar"><i style="width:0;background:linear-gradient(90deg,var(--done),#4cc485)" data-w="${c.pct}%"></i></div>
          <div style="font-size:13px;color:var(--ink-2);margin-top:6px">คะแนนเฉลี่ย ${c.avg==null?'–':Math.round(c.avg)+'%'}</div><div class="bar"><i style="width:0" data-w="${c.avg||0}%"></i></div></div>`).join('')}
      </div></div>
      <div class="panel"><h3>${ic('alert','width="20" height="20"')} นักเรียนที่ต้องติดตาม <span class="mono">งานที่เปิดแล้ว</span></h3>
        <div class="follow">${followActive.length ? followActive.slice(0,60).map(f => `<div class="fl"><span class="badge">${f.miss.length}</span><div class="n">${esc(f.s.name)}<small>ห้อง ${esc(f.s.cls)} • เลขที่ ${esc(f.s.number)}</small></div>
          <div class="miss">${f.miss.map(x => `<span class="mtag ${kindOf(f.s.status[x.key])==='redo'?'r':''}">${esc(splitTitle(x.title).tag || x.key)}</span>`).join('')}</div></div>`).join('') : '<div class="empty" style="padding:20px"># ทุกคนส่งงานครบ 🎉</div>'}</div>
      </div>
    </div>
  </div>`;
}

    ${items.map(x => { const t = splitTitle(x.title); return `<th title="${esc(x.title)}"><div class="tg">${esc(t.tag||x.key)}</div><small>${esc(t.name)}</small></th>`; }).join('')}<th>ส่งแล้ว</th></tr></thead>

/* ---- Score grid ---- */
function tabScore(){
  const A = S.admin, list = filteredStudents().filter(s => s.inScore);
  const items = A.items.filter(x => x.inScore);
  const totalMax = items.reduce((a,x)=>a+(x.max||0),0);
  return `
  <div class="tbl-wrap"><table class="gt"><thead><tr><th class="stk c0">เลขที่</th><th class="stk c1">ชื่อ-สกุล</th><th>ห้อง</th>
    ${items.map(x => { const t = splitTitle(x.title); return `<th title="${esc(x.title)}"><div class="tg">${esc(t.tag||x.key)}</div><small>${esc(t.name)}</small><small style="color:var(--py-blue)">เต็ม ${x.max==null?'–':fmt(x.max)}</small></th>`; }).join('')}
    <th>รวม<small>เต็ม ${fmt(totalMax)}</small></th></tr></thead>
    <tbody>${list.map(s => {
      let sum = 0;
      const cells = items.map(x => { const v = curVal('score', s, x.key); const n = num(v); if (n!=null) sum += n;
        const over = n!=null && x.max!=null && n > x.max; const dirty = S.dirty.has(dkey('score', s, x.key));
        const k = kindOf(s.status[x.key]);
        return `<td><input class="si ${over?'over':''} ${dirty?'dirty':''}" inputmode="decimal" value="${esc(v)}" data-t="score" data-s="${esc(sid(s))}" data-k="${esc(x.key)}" data-max="${x.max==null?'':x.max}" title="${x.inStatus?'สถานะ: '+esc(s.status[x.key]||'ยังไม่ส่ง'):''}" style="${x.inStatus && k==='todo' && v===''?'background:#fafbfc':''}"></td>`; }).join('');
      return `<tr><td class="stk c0">${esc(s.number)}</td><td class="stk c1 l">${esc(s.name)}</td><td>${esc(s.cls)}</td>${cells}<td class="mono"><b>${fmt(sum)}</b></td></tr>`;
    }).join('') || `<tr><td colspan="${items.length+4}" class="empty">ไม่พบนักเรียน</td></tr>`}</tbody></table></div>
  <p style="font-size:13px;color:var(--ink-3);margin:10px 2px 0"># ช่องสีแดง = เกินคะแนนเต็ม • กด Tab / Enter เพื่อเลื่อนช่อง • ปล่อยว่างเพื่อลบคะแนน</p>
  ${saveBar()}`;
}

function parseCSV(text){
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i+1] === '"') { f += '"'; i++; } else q = false; }
      else f += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n') { row.push(f); rows.push(row); row = []; f = ''; }
    else if (c !== '\r') f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows;
}

const LIVE = (() => {
  let cache = null, cacheAt = 0;
  const clean = s => String(s == null ? '' : s).replace(/\s+/g, ' ').trim();
  const normId = s => String(s || '').trim().replace(/^'/, '').replace(/^0+(?=\d)/, '');
  const keyOf = t => { t = String(t).replace(/\(\s*\d+(?:\.\d+)?\s*\)\s*$/, '').trim(); const i = t.indexOf(':'); return (i > 0 ? t.slice(0, i) : t).toUpperCase().replace(/\s+/g, ''); };
  const parseHeader = h => { h = clean(h); let title = h, max = null; const m = h.match(/\(\s*(\d+(?:\.\d+)?)\s*\)\s*$/); if (m) { max = Number(m[1]); title = h.slice(0, m.index).trim(); } return { key: keyOf(title), title, max }; };
  function fixedCols(headers){
    const low = headers.map(h => h.toLowerCase().replace(/[\s_\-.]/g, ''));
    const find = names => { for (const n of names){ const j = low.indexOf(n); if (j >= 0) return j; } return -1; };
    return { number: find(['number','no','เลขที่']), stdId: find(['stdid','studentid','รหัสนักเรียน','รหัส']),
             name: find(['name','ชื่อสกุล','ชื่อนามสกุล','ชื่อ']), cls: find(['class','ห้อง','ชั้น']),
             username: find(['username','user']), password: find(['password','pass','รหัสผ่าน']) };
  }
  function table(values){
    const headers = (values[0] || []).map(clean);
    const rows = values.slice(1).filter(r => r.some(c => String(c).trim()));
    return { headers, rows, col: fixedCols(headers) };
  }
  const cell = (t, r, k) => t.col[k] >= 0 ? clean(r[t.col[k]]) : '';
  const aCols = t => { const fx = Object.values(t.col); return t.headers.map((h, i) => i).filter(i => t.headers[i] && !fx.includes(i)); };
  function findRow(t, q){
    if (q.stdId && t.col.stdId >= 0){ const id = normId(q.stdId); const i = t.rows.findIndex(r => normId(r[t.col.stdId]) === id); if (i >= 0) return i; }
    if (q.name && t.col.name >= 0){ const n = clean(q.name); const i = t.rows.findIndex(r => clean(r[t.col.name]) === n); if (i >= 0) return i; }
    return -1;
  }
  function mergeItems(st, sc){
    const list = [];
    aCols(st).forEach(c => { const p = parseHeader(st.headers[c]); if (!list.some(x => x.key === p.key)) list.push({...p, stCol:c, scCol:-1}); });
    let last = -1;
    aCols(sc).forEach(c => {
      const p = parseHeader(sc.headers[c]); const i = list.findIndex(x => x.key === p.key);
      if (i >= 0) { if (list[i].scCol < 0) list[i].scCol = c; if (p.max != null) list[i].max = p.max; last = i; }
      else { list.splice(last + 1, 0, {...p, stCol:-1, scCol:c}); last++; }
    });
    list.forEach(x => x.link = '');
    return list;
  }
  async function fetchSheet(id){
    let r;
    try { r = await fetch(`https://docs.google.com/spreadsheets/d/${id}/export?format=csv`, {cache:'no-store'}); }
    catch(e){ throw new Error('เชื่อมต่อ Google Sheets ไม่ได้ กรุณาตรวจสอบอินเทอร์เน็ต'); }
    const t = await r.text();
    if (!r.ok || /^\s*</.test(t)) throw new Error('อ่าน Google Sheets ไม่ได้ — ตรวจสอบว่าแชร์ชีตแบบ "ทุกคนที่มีลิงก์ดูได้"');
    return table(parseCSV(t));
  }
  async function load(force){
    if (!force && cache && Date.now() - cacheAt < 15000) return cache;
    const [lg, st, sc] = await Promise.all([fetchSheet(SHEETS.login), fetchSheet(SHEETS.status), fetchSheet(SHEETS.score)]);
    cache = {lg, st, sc}; cacheAt = Date.now();
    return cache;
  }
  function studentData(D, sess){
    const {st, sc} = D, items = mergeItems(st, sc);
    let si = findRow(st, {name: sess.name}); if (si < 0) si = findRow(st, {stdId: sess.id});
    let ci = findRow(sc, {name: sess.name}); if (ci < 0) ci = findRow(sc, {stdId: sess.id});
    const sRow = si >= 0 ? st.rows[si] : null, cRow = ci >= 0 ? sc.rows[ci] : null;
    return {
      profile: { number: sess.number || (sRow ? cell(st, sRow, 'number') : ''),
                 stdId: (sRow && cell(st, sRow, 'stdId')) || (cRow && cell(sc, cRow, 'stdId')) || sess.id,
                 name: sess.name, cls: sess.cls || (sRow ? cell(st, sRow, 'cls') : ''), username: sess.username },
      items: items.map(x => ({ key:x.key, title:x.title, max:x.max, link:x.link, hasStatus:x.stCol >= 0, hasScore:x.scCol >= 0,
        status: x.stCol >= 0 && sRow ? clean(sRow[x.stCol]) : '', score: x.scCol >= 0 && cRow ? clean(cRow[x.scCol]) : '' })),
      found: { status: !!sRow, score: !!cRow }, announce: '', updatedAt: new Date().toISOString()
    };
  }
  function findStudent(D, id){
    const {lg, st, sc} = D;
    if (lg.col.password >= 0){
      const r = lg.rows.find(r => { const a = clean(r[lg.col.password]); return a === id || (/^\d+$/.test(a) && normId(a) === normId(id)); });
      if (r) return { name: cell(lg, r, 'name'), cls: cell(lg, r, 'cls'), number: cell(lg, r, 'number'), username: cell(lg, r, 'username'), id };
    }
    for (const t of [st, sc]){ const i = findRow(t, {stdId: id}); if (i >= 0){ const r = t.rows[i]; return { name: cell(t, r, 'name'), cls: cell(t, r, 'cls'), number: cell(t, r, 'number'), username: '', id }; } }
    return null;
  }
  const RO = () => { throw new Error('โหมด LIVE อ่านข้อมูลได้อย่างเดียว — การแก้ไขให้ทำใน Google Sheets หรือติดตั้งบน Apps Script'); };
  async function sha256(s){
    if (!window.crypto || !crypto.subtle) throw new Error('เบราว์เซอร์นี้ไม่รองรับการตรวจสอบรหัสผ่าน (ต้องเปิดผ่าน https)');
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
  }
  return {
    getPublicInfo: () => ({ app: DEFAULT_APP, announce: '' }),
    async studentLogin(id){
      id = String(id || '').replace(/\s+/g, '');
      if (!id) throw new Error('กรุณากรอกรหัสนักเรียน');
      if (!/^\d{3,10}$/.test(id)) throw new Error('รหัสนักเรียนต้องเป็นตัวเลขเท่านั้น');
      const D = await load(true);
      const sess = findStudent(D, id);
      if (!sess || !sess.name) throw new Error(`ไม่พบรหัสนักเรียน ${id} ในระบบ`);
      return { token: 'stu:' + id, data: studentData(D, sess) };
    },
    async getStudentData(token){
      const id = String(token || '').replace(/^stu:/, '');
      const D = await load(true);
      const sess = findStudent(D, id);
      if (!sess) throw new Error('SESSION_EXPIRED');
      return studentData(D, sess);
    },
    logout: () => true,
    async adminLogin(u, p){
      if (await sha256(String(u).trim() + ':' + p) !== ADMIN_HASH) throw new Error('ชื่อผู้ใช้หรือรหัสผ่านครูไม่ถูกต้อง');
      return { token: 'admin:' + ADMIN_HASH.slice(0, 16) };
    },
    async adminGetData(token){
      if (token !== 'admin:' + ADMIN_HASH.slice(0, 16)) throw new Error('SESSION_EXPIRED');
      const {lg, st, sc} = await load(true);
      const items = mergeItems(st, sc);
      const students = [], usedL = new Set(), usedS = new Set();
      const fromLogin = (rec, name) => { let li = findRow(lg, {name});
        if ((li < 0 || usedL.has(li)) && rec.stdId && lg.col.password >= 0) li = lg.rows.findIndex((r, i) => !usedL.has(i) && normId(r[lg.col.password]) === normId(rec.stdId)); if (li >= 0 && !usedL.has(li)){ usedL.add(li); rec.inLogin = true; rec.username = cell(lg, lg.rows[li], 'username'); rec.password = cell(lg, lg.rows[li], 'password'); if (!rec.number) rec.number = cell(lg, lg.rows[li], 'number'); } };
      st.rows.forEach(r => {
        const name = cell(st, r, 'name'); if (!name) return;
        const rec = { number: cell(st, r, 'number'), stdId: cell(st, r, 'stdId'), name, cls: cell(st, r, 'cls'), username:'', password:'', status:{}, score:{}, inStatus:true, inScore:false, inLogin:false };
        items.forEach(x => { if (x.stCol >= 0) rec.status[x.key] = clean(r[x.stCol]); });
        const ci = findRow(sc, {stdId: rec.stdId, name});
        if (ci >= 0 && !usedS.has(ci)){ usedS.add(ci); rec.inScore = true; items.forEach(x => { if (x.scCol >= 0) rec.score[x.key] = clean(sc.rows[ci][x.scCol]); }); }
        fromLogin(rec, name);
        students.push(rec);
      });
      sc.rows.forEach((r, i) => {
        const name = cell(sc, r, 'name'); if (!name || usedS.has(i)) return;
        const rec = { number: cell(sc, r, 'number'), stdId: cell(sc, r, 'stdId'), name, cls: cell(sc, r, 'cls'), username:'', password:'', status:{}, score:{}, inStatus:false, inScore:true, inLogin:false };
        items.forEach(x => { if (x.scCol >= 0) rec.score[x.key] = clean(r[x.scCol]); });
        fromLogin(rec, name); students.push(rec);
      });
      lg.rows.forEach((r, i) => {
        const name = cell(lg, r, 'name'); if (!name || usedL.has(i)) return;
        students.push({ number: cell(lg, r, 'number'), stdId:'', name, cls: cell(lg, r, 'cls'), username: cell(lg, r, 'username'), password: cell(lg, r, 'password'), status:{}, score:{}, inStatus:false, inScore:false, inLogin:true });
      });
      return {
        app: DEFAULT_APP, readOnly: true,
        items: items.map(x => ({ key:x.key, title:x.title, max:x.max, link:x.link, inStatus:x.stCol >= 0, inScore:x.scCol >= 0 })),
        students, classes: [...new Set(students.map(s => s.cls).filter(Boolean))].sort(),
        statusOptions: ['ตรวจแล้ว','ส่งแล้ว','ส่งช้า','ส่งใหม่'], announce: '', adminUser: 'khanapot',
        sheets: Object.fromEntries(Object.entries(SHEETS).map(([k, id]) => [k, `https://docs.google.com/spreadsheets/d/${id}/edit`])),
        updatedAt: new Date().toISOString()
      };
    },
    adminSaveChanges: RO, adminAddAssignment: RO, adminUpdateAssignment: RO, adminDeleteAssignment: RO,
    adminSaveStudent: RO, adminDeleteStudent: RO, adminSetAnnouncement: RO, adminChangeCredentials: RO
  };
})();

/* =====================================================================
 *  Demo mock backend (?demo=1)

  const items = [

  ].map(([title,max,st,sc]) => ({key: (title.includes(':')?title.split(':')[0]:title).toUpperCase().replace(/\s+/g,''), title, max, link:'', inStatus:!!st, inScore:!!sc}));
  items[5].link = 'https://classroom.google.com/';
  let seed = 7; const rnd = () => (seed = (seed*9301+49297)%233280)/233280;
  const first = ['ตัวอย่าง','ภูมิ','ปัณณ์','ธาม','กันต์','ณิชา','พิมพ์','ใบเตย','ภัทร','ต้นกล้า','มายด์','ข้าวหอม'];
  const last = ['ทดสอบระบบ','ใจดี','รักเรียน','สุขสันต์','มั่นคง','ศรีสุข','แสงทอง','วงศ์ไพบูลย์'];
  const students = []; let id = 5867;
  ['2/1','2/2','2/3','2/4'].forEach((cls, ci) => {
    for (let n=1;n<=8;n++){
      const fn = ci===0 && n===1 ? 'ตัวอย่าง' : first[1 + Math.floor(rnd()*(first.length-1))] + (ci*8+n);
      const girl = rnd() > .5 && !(ci===0&&n===1);
      const s = { number:String(n), stdId:String(id++).padStart(5,'0'), name:`${girl?'เด็กหญิง':'เด็กชาย'}${fn} ${last[Math.floor(rnd()*last.length)]}`, cls,
        username: ci===0&&n===1 ? 'demo' : fn, password:'', status:{}, score:{}, inStatus:true, inScore:true, inLogin:true };
      s.password = ci===0&&n===1 ? '00001' : s.stdId;
      items.forEach((x, i) => {
        if (x.inStatus) {
          const r = rnd();
          s.status[x.key] = i < 4 ? (r < .82 ? 'ตรวจแล้ว' : r < .9 ? 'ส่งช้า' : r < .95 ? 'ส่งใหม่' : '') : i < 5 ? (r < .6 ? 'ตรวจแล้ว' : r < .7 ? 'ส่งแล้ว' : '') : '';
          if (ci===0&&n===1 && i===4) s.status[x.key] = 'ส่งใหม่';
        }
        if (x.inScore) s.score[x.key] = (x.inStatus && ['ตรวจแล้ว','ส่งช้า'].includes(s.status[x.key]) && x.max) ? String(Math.max(1, x.max - Math.floor(rnd()*2))) : '';
      });
      students.push(s);
    }
  });
  let announce = 'ส่งงาน W6 : nested if ภายในวันศุกร์นี้ ก่อน 16.00 น. นะครับ 🐍';
  let admin = {user:'demo', pass:'demo1234'};
  const sessions = {};
  const tok = d => { const t = Math.random().toString(36).slice(2); sessions[t] = d; return t; };
  const need = (t, role) => { const s = sessions[t]; if (!s) throw new Error('SESSION_EXPIRED'); if (role && s.role!==role) throw new Error('ไม่มีสิทธิ์'); return s; };
  const findS = q => students.find(s => (q.stdId && s.stdId===q.stdId) || s.name===q.name);
  const stuData = s => ({ profile:{number:s.number, stdId:s.stdId, name:s.name, cls:s.cls, username:s.username},
    items: items.map(x => ({key:x.key, title:x.title, max:x.max, link:x.link, hasStatus:x.inStatus, hasScore:x.inScore, status:s.status[x.key]||'', score:s.score[x.key]||''})),
    found:{status:true, score:true}, announce, updatedAt:new Date().toISOString() });
  return {
    getPublicInfo: () => ({app, announce}),
    studentLogin(id){ id = String(id).replace(/\s+/g,''); if (!id) throw new Error('กรุณากรอกรหัสนักเรียน'); const s = students.find(s => s.password.replace(/^0+/,'')===id.replace(/^0+/,'')); if (!s) throw new Error(`ไม่พบรหัสนักเรียน ${id} ในระบบ`); return {token: tok({role:'student', name:s.name}), data: stuData(s)}; },
    getStudentData(t){ return stuData(findS({name: need(t,'student').name})); },
    logout(t){ delete sessions[t]; return true; },
    adminLogin(u, p){ if (u!==admin.user || p!==admin.pass) throw new Error('ชื่อผู้ใช้หรือรหัสผ่านครูไม่ถูกต้อง'); return {token: tok({role:'admin'})}; },
    adminGetData(t){ need(t,'admin'); return {app, items, students, classes:[...new Set(students.map(s=>s.cls))].sort(), statusOptions:['ตรวจแล้ว','ส่งแล้ว','ส่งช้า','ส่งใหม่'], announce, adminUser:admin.user,
      sheets:{login:'https://docs.google.com/spreadsheets/d/1lPC9ueFH1FVSBiSC_erp1eZGASi7EtmF1KUi-K5rfIE/edit', status:'https://docs.google.com/spreadsheets/d/1n5-IxePWdAiUkJMuHD725WFTBmzOq09jGAfZp_EMrgg/edit', score:'https://docs.google.com/spreadsheets/d/1jN1R_NomnCVPaW2Vou9qvU6H7r_WeZEJf0Iigyh8unE/edit'}, updatedAt:new Date().toISOString()}; },
    adminSaveChanges(t, ch){ need(t,'admin'); let saved=0; ch.forEach(c => { const s = findS(c); if (s){ (c.type==='status'?s.status:s.score)[c.key] = String(c.value); saved++; } }); return {saved, failed: ch.length-saved}; },
    adminAddAssignment(t, a){ need(t,'admin'); const key = (a.title.includes(':')?a.title.split(':')[0]:a.title).toUpperCase().replace(/\s+/g,''); if (items.some(x=>x.key===key)) throw new Error(`มีภาระงานรหัส "${key}" อยู่แล้ว`); items.push({key, title:a.title, max:a.max===''?null:Number(a.max), link:a.link, inStatus:a.toStatus, inScore:a.toScore}); return {key}; },
    adminUpdateAssignment(t, a){ need(t,'admin'); const x = items.find(x=>x.key===a.key); x.title=a.title; x.max=a.max===''?null:Number(a.max); x.link=a.link; return {key:x.key}; },
    adminDeleteAssignment(t, key){ need(t,'admin'); const i = items.findIndex(x=>x.key===key); if (i>=0) items.splice(i,1); return true; },
    adminSaveStudent(t, v, orig){ need(t,'admin'); const s = orig ? findS(orig) : null; if (s) Object.assign(s, v); else students.push({...v, status:{}, score:{}, inStatus:true, inScore:true, inLogin:true}); return true; },
    adminDeleteStudent(t, orig){ need(t,'admin'); const i = students.indexOf(findS(orig)); if (i>=0) students.splice(i,1); return true; },
    adminSetAnnouncement(t, text){ need(t,'admin'); announce = text; return true; },
    adminChangeCredentials(t, cur, u, p){ need(t,'admin'); if (cur!==admin.pass) throw new Error('รหัสผ่านปัจจุบันไม่ถูกต้อง'); if (p.length<6) throw new Error('รหัสผ่านใหม่ต้องมีอย่างน้อย 6 ตัวอักษร'); admin = {user:u.trim(), pass:p}; return true; }
  };
})();

/* =====================================================================
 *  Boot
 * =================================================================== */
(async function boot(){
  decorate();
  applyApp({ title:'ระบบส่งงานและดูคะแนน', subject:'การเขียนโปรแกรมคอมพิวเตอร์', level:'ชั้นมัธยมศึกษาปีที่ 2  ภาคเรียนที่ 2  ปีการศึกษา 2569', school:'โรงเรียนวิทยาศาสตร์จุฬาภรณราชวิทยาลัย เชียงราย', logoUrl:'' });
  if (MODE === 'demo') document.body.insertAdjacentHTML('beforeend', '<div class="demo-badge">DEMO MODE • ข้อมูลจำลอง</div>');
  if (MODE === 'live') document.body.insertAdjacentHTML('beforeend', '<div class="demo-badge" style="background:#22a565;color:#fff">● LIVE • Google Sheets</div>');
  if (MODE === 'api') document.body.insertAdjacentHTML('beforeend', '<div class="demo-badge" style="background:#3776ab;color:#fff">● CONNECTED • Apps Script</div>');
  try { const info = await api('getPublicInfo'); applyApp(info.app); S.announce = info.announce; } catch(e){}
  const saved = store.get();
  if (saved && saved.token) {
    S.token = saved.token; S.role = saved.role;
    try {
      if (saved.role === 'admin') { await loadAdmin(); return; }
      const d = await run(() => api('getStudentData', S.token), 'กำลังโหลดข้อมูลงาน...');
      if (d) { S.student = d; renderStudent(); return; }
    } catch(e){ store.set(null); }
  }
  if (!S.role || !$('#app').innerHTML) renderLogin();
})();
